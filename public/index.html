<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bolinha - Teoria dos Conjuntos</title>
    <!-- Carrega o arquivo styles.css que está na pasta public -->
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <!-- Canvas principal onde o jogo é desenhado.
         O client.js procura por este id ("gameCanvas") para desenhar. -->
    <canvas id="gameCanvas"></canvas>

    <!-- Canvas separado do minimapa, no canto da tela.
         width e height fixos em 150px porque o minimapa não redimensiona. -->
    <canvas id="minimap" width="150" height="150"></canvas>

    <!-- Biblioteca do Socket.io: permite comunicação em tempo real com o servidor.
         O servidor a serve automaticamente neste caminho (/socket.io/socket.io.js). -->
    <script src="/socket.io/socket.io.js"></script>

    <!-- Nosso código do cliente: conecta ao servidor, desenha o jogo e o minimapa. -->
    <script src="/client.js"></script>
</body>
</html>
