<!DOCTYPE html>
<html>
<style>
  body {
    margin: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background-color: black;
    width: 100vw;
    min-height: 600px;
    height: 100vh;
  }

  canvas {
    margin: auto;
    border: 1px solid white;
    width: 600px;
    height: 600px;
  }
</style>
<body>
  <canvas id="game"></canvas>
  <script src="http://localhost:3000/socket.io/socket.io.js"></script>
  <script>
    const socket = io("http://localhost:3000");
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const myRoom = "sala123";

    socket.emit("join-room", myRoom);

    // Desenha todos os jogadores sempre que houver atualização
    socket.on("update-players", (players) => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let id in players) {
        const p = players[id];
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, 10, 5); // O quadrado
      }
    });

    // Controlos do teclado (WASD + Setas)
    window.addEventListener("keydown", (e) => {
        const move = { x: 0, y: 0 };
        const speedX = 4;
        const speedY = 2;

        // Movimento Horizontal
        if (e.key === "ArrowRight" || e.key.toLowerCase() === "d") move.x = speedX;
        if (e.key === "ArrowLeft" || e.key.toLowerCase() === "a") move.x = -speedX;
        
        // Movimento Vertical
        if (e.key === "ArrowUp" || e.key.toLowerCase() === "w") move.y = -speedY;
        if (e.key === "ArrowDown" || e.key.toLowerCase() === "s") move.y = speedY;

        // Só envia se houver algum movimento
        if (move.x !== 0 || move.y !== 0) {
            socket.emit("move", myRoom, move);
        }
    });

  </script>
</body>
</html>
