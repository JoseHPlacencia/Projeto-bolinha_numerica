<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>Teoria dos Conjuntos</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<canvas id="gameCanvas"></canvas>
<div id="hud" class="hud">
    <div id="debugPanel" class="debug-panel" hidden>
        <div><span>FPS</span><strong id="debugFps">0</strong></div>
        <div><span>Frame</span><strong id="debugFrame">0ms</strong></div>
        <div><span>Buffer</span><strong id="debugBuffer">0ms</strong></div>
        <div><span>Snapshots</span><strong id="debugSnapshots">0</strong></div>
        <div><span>DPR</span><strong id="debugPixelRatio">1</strong></div>
        <div><span>Canvas</span><strong id="debugCanvas">0x0</strong></div>
    </div>
</div>
<button id="roomMenuButton" class="room-menu-button" type="button">Sala</button>
<div id="roomModal" class="room-modal" aria-hidden="true">
    <div class="room-modal__content" role="dialog" aria-modal="true" aria-label="Menu de salas">
        <div class="room-modal__header">
            <h1>Menu de salas</h1>
            <button id="closeRoomMenuButton" class="room-modal__close" type="button">×</button>
        </div>

        <div class="room-modal__section room-modal__form room-modal__private-card">
            <label class="room-toggle">
                <input id="privateRoomCheckbox" type="checkbox">
                <span class="room-toggle__track"><span class="room-toggle__thumb"></span></span>
                <span class="room-toggle__label">Sala privada</span>
            </label>
            <p class="room-modal__hint">Proteja a sala com senha e compartilhe o código apenas com quem você quiser.</p>
            <label for="roomCreatePasswordInput" class="room-modal__input-label hidden">Senha da sala</label>
            <input id="roomCreatePasswordInput" class="room-modal__input hidden" type="password" maxlength="20" autocomplete="new-password" placeholder="Senha para sala privada">
            <button id="createRoomButton" class="room-button room-button--accent" type="button">Criar nova sala</button>
        </div>

        <div class="room-modal__divider"><span>ou</span></div>

        <div class="room-modal__section room-modal__form">
            <label for="roomCodeInput">Código da sala</label>
            <input id="roomCodeInput" type="text" maxlength="6" autocomplete="off" inputmode="text" placeholder="ABC123">
            <label for="roomJoinPasswordInput">Senha da sala</label>
            <input id="roomJoinPasswordInput" type="password" maxlength="20" autocomplete="current-password" placeholder="Senha da sala privada">
            <button id="joinRoomButton" class="room-button" type="button">Entrar</button>
        </div>

        <div class="room-modal__section">
            <div class="rooms-filter">
                <span>Salas ativas:</span>
                <div class="rooms-filter__badges">
                    <button id="filterAllBtn" class="rooms-filter__badge rooms-filter__badge--active" data-filter="all" type="button">Todas</button>
                    <button id="filterPublicBtn" class="rooms-filter__badge" data-filter="public" type="button">Públicas</button>
                    <button id="filterPrivateBtn" class="rooms-filter__badge" data-filter="private" type="button">Privadas</button>
                </div>
            </div>
            <ul id="roomsList" class="rooms-list"></ul>
        </div>

        <p id="roomStatus" class="room-status" aria-live="polite"></p>

        <div id="roomInfo" class="room-info hidden">
            <span>Sala atual:</span>
            <strong id="roomCodeDisplay"></strong>
            <button id="leaveRoomButton" class="room-link" type="button">Sair da sala</button>
        </div>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/shared/math.js"></script>
<script type="module" src="/client.js"></script>
</body>
</html>
